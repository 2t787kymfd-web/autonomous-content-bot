mode: live
survival:
  starting_balance_usd: 50.0
  monthly_fixed_cost_usd: 4.0
  min_balance_to_operate_usd: 1.0
seed_niches:
- USD/EUR/GBP/AUD対円 為替レートまとめ
- ビットコイン・イーサリアム価格ダッシュボード
- 日本の主要都市 天気予報まとめ
- 地震情報ダッシュボード
niches_per_cycle: 3
quality_gate:
  min_word_count: 400
  max_similarity_ratio: 0.6
llm:
  provider: anthropic
  model: claude-sonnet-4-6
publish:
  output_dir: docs
revenue:
  source: manual
reinvestment:
  enabled: true
  min_cycles_before_judgement: 3
  min_cycles_after_revenue: 3
  loss_threshold_usd: -1.0
kind_generator:
  enabled: true
