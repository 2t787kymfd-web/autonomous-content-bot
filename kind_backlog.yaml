      fx_converter等と同じく完全にクライアントサイドJavaScriptで完結できる
      処理である(ユーザーがブラウザで入力したテキストを、ブラウザの
      標準関数encodeURIComponent()でURLエンコードし、
      https://api.qrserver.com/v1/create-qr-code/?data=...のURLを
      動的に組み立てて<img>のsrcに設定するだけでよい)。fetch()側は
      サーバーサイドでAPIを叩く必要が無いため、固定の説明用データ
      (bmi_calculator等と同じ「外部APIは不要」パターン)を返せばよい。
      Pythonのrequests.utilsやurllib.parseは一切使わないこと。"
    status: done

