  - kind_name_hint: nasa_apod
    niche_seed: "NASA今日の天体写真(APOD)"
    category: "天文・暦"
    notes: "NASA APIはDEMO_KEYで登録無しに利用可能(レート制限あり)。
      【2026-07-31追記(1)】前回は500 Internal Service Errorで失敗。手動で
