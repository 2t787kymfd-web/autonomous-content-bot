# =====================================================
# kind_backlog.yaml
# =====================================================
# 新kind一括拡張のための人間主導バックログ。
#
# main_loop.py の自律6時間サイクルとは別に、src/kind_backlog.py を
# 人間が明示的に実行して1〜2件ずつ消化する(status: pending のものから
# 順に取り出し、既存の propose_new_kind → validate_plugin_code →
# test_plugin → create_kind_pr パイプラインにtarget_niche指定でかける)。
#
# 元の候補32件のうち、YMYL(Your Money or Your Life)領域に該当する
# 以下の3件は当面除外・保留とし、このファイルには含めていない:
#   - 干支・年齢早見表
#   - 国別基礎情報
#   - 各国GDP・人口統計
# 「季節の旬の野菜・果物・魚カレンダー」は生きたAPIが存在せず、
# kind_generator.pyの検証パイプライン(実データ疎通テスト)に乗らないため、
# このバックログには含めない(専用の手動ルートで別途対応する)。
#
# status: pending | done | skipped
#   done    = PR作成成功(マージ有無は問わない。マージ判断は人間がGitHub上で行う)
#   skipped = 動作テスト等で継続的に失敗し、いったん見送ったもの

candidates:
  # --- 金融 ---
  - kind_name_hint: policy_interest_rates
    niche_seed: "主要国政策金利一覧"
    category: "金融"
    notes: "FRB/ECB/日銀等の政策金利。無料・キー不要の公式APIが見当たらない場合は
      requires_paid_api=trueにしてIssue化してよい。"
    status: skipped

  - kind_name_hint: precious_metals
    niche_seed: "貴金属価格(金・銀・プラチナ)"
    category: "金融"
    notes: "無料・キー不要のAPIを探すこと(為替系APIの貴金属相場対応有無を確認)。"
    status: skipped

  - kind_name_hint: stock_indices
    niche_seed: "主要株価指数終値まとめ"
    category: "金融"
    notes: "日経平均・NYダウ等の終値。無料・キー不要で取得できる公式ソースが
      限られるため、見つからない場合はrequires_paid_apiで報告してよい。"
    status: done

