      NASA側のAPOD API(DEMO_KEY利用時)が現在不安定/障害中の可能性が高い。
      日を置いて再挑戦すること。
      【2026-07-31追記(2)】次に'SafeRequestsModule' object has no attribute
      'exceptions'で失敗(requests.exceptions.XXXを参照するコードだった)。
      requests.exceptionsはSafeRequestsModuleに公開済みなので次回は
      通るはず。
      【2026-07-31追記(3)】3回目は再び500 Internal Service Errorだったが、
      その後手動確認したところAPI自体は復旧していた(HTTPステータス200を
      確認済み)。NASA側の一時的な不安定化だった可能性が高いので、
      今回は素直に再挑戦してよい。
      【2026-07-31追記(4)】4回目は429 Too Many Requestsで失敗。その後の
      手動確認では200に復旧しており、500→200→429→200と不安定に推移して
      いる。DEMO_KEYは世界中の未登録ユーザーで共有される仕組みのため、
      自分のリクエストと無関係に他ユーザーの負荷でレート制限にかかりうる
      (構造的な問題であり、コード側の対応では解決しない)。再挑戦時に
      複数回連続で失敗する場合は無理に追わず、無料の個人用APIキー登録
      (https://api.nasa.gov/ で即時発行可能、登録自体は無料)への切り替えを
      検討すること。"
    status: skipped

