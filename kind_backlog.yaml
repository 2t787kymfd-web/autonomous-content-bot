      requires_paid_api=trueにしてIssue化してよい。
      【2026-07-31追記(1)】前回next()の使用がAST検証で却下されたが、next/any/all/
      filter/map/iterは許可リストに追加済みなので次回は同じ理由では失敗しない。
      【2026-07-31追記(2)】次にWorldBank APIを試みたが、政策金利自体は継続的に
      取得できず、実数値をソースコードに静的に埋め込む(2025年1月時点、以後更新
      されない)実装になってしまいPRをクローズした。政策金利を継続的に返す
      無料APIが見つからない限りこのniche自体を諦めてrequires_paid_api=true、
      または別の切り口(例: 各国の金利変更履歴を発表するRSS等)を検討すること。
      「実数値がハードコードされ二度と更新されない」実装は禁止。"
    status: skipped

