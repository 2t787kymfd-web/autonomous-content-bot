<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css">
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-6750806391010121" crossorigin="anonymous"></script>
<style>
:root { --header-bg: #f5f3ff; --header-border: #ddd6fe; --logo-accent: #4f46e5; }
@media (prefers-color-scheme: dark) {
  :root { --header-bg: #1e1b3a; --header-border: #3730a3; --logo-accent: #a5b4fc; }
}
.site-header { background: var(--header-bg); border-bottom: 1px solid var(--header-border); }
.logo-icon { vertical-align: -5px; margin-right: 4px; }
.logo-text { color: var(--logo-accent); font-size: 1.15rem; }
.site-header a { text-decoration: none; }
@media (max-width: 480px) {
  .site-header nav { flex-direction: column; gap: 10px; }
  .site-header nav ul { justify-content: center; flex-wrap: wrap; }
}
.site-footer { text-align: center; padding: 24px 16px; font-size: 0.85rem; }
.row { margin: 16px 0; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.result { font-size: 1.5rem; font-weight: 700; color: var(--logo-accent); margin-top: 16px; }
.source {
  font-size: 0.8rem; margin-top: 24px; padding-top: 16px;
  border-top: 1px dashed var(--pico-muted-border-color, #ddd);
}
</style>
</head>
<body>
<header class="container site-header">
  <nav>
    <ul>
      <li><a href="index.html"><svg class="logo-icon" width="22" height="22" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><rect x="3" y="12" width="4" height="9" rx="1" fill="#4f46e5"/><rect x="10" y="6" width="4" height="15" rx="1" fill="#7c3aed"/><rect x="17" y="9" width="4" height="12" rx="1" fill="#4f46e5"/></svg><strong class="logo-text">データツールハブ</strong></a></li>
    </ul>
    <ul>
      <li><a href="index.html">トップ</a></li>
      <li><a href="about.html">運営者情報</a></li>
      <li><a href="privacy.html">プライバシーポリシー</a></li>
    </ul>
  </nav>
</header>
<main class="container">
  <article>
  <h1>💱 USD/EUR/GBP/AUD対円 為替レートまとめ</h1>
  <p>基準日: 2026-07-30 のレートを使った換算ツールです。</p>

  <div class="row">
    <input id="amount" type="number" value="1" step="any">
    <select id="currency"></select>
    <span>→ JPY</span>
  </div>

  <div class="result" id="result"></div>
  <div class="source">データ出典: https://frankfurter.dev (ECB公表データ)(基準日 2026-07-30 時点)</div>
  </article>
</main>
<footer class="site-footer">
  <a href="about.html">運営者情報</a> ・
  <a href="privacy.html">プライバシーポリシー</a>
  <p>&copy; データツールハブ — データは自動取得・自動更新されています</p>
</footer>

<script>
  const rates = {"USD": 162.94, "EUR": 186.99, "GBP": 218.15, "AUD": 113.75};
  const target = "JPY";

  const select = document.getElementById("currency");
  Object.keys(rates).forEach(code => {
    const opt = document.createElement("option");
    opt.value = code;
    opt.textContent = code;
    select.appendChild(opt);
  });

  function update() {
    const amount = parseFloat(document.getElementById("amount").value) || 0;
    const code = select.value;
    const rate = rates[code];
    const converted = (amount * rate).toLocaleString(undefined, {maximumFractionDigits: 2});
    document.getElementById("result").textContent = `${amount} ${code} = ${converted} ${target}`;
  }

  document.getElementById("amount").addEventListener("input", update);
  select.addEventListener("change", update);
  update();
</script>
</body>
</html>
