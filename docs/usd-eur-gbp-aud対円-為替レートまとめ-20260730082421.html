<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>USD/EUR/GBP/AUD対円 為替レートまとめ</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  body { font-family: sans-serif; max-width: 480px; margin: 40px auto; padding: 0 16px; }
  h1 { font-size: 1.3rem; }
  .row { margin: 12px 0; }
  input, select { font-size: 1rem; padding: 6px; }
  .result { font-size: 1.4rem; font-weight: bold; margin-top: 16px; }
  .source { font-size: 0.8rem; color: #666; margin-top: 24px; }
</style>
</head>
<body>
  <h1>USD/EUR/GBP/AUD対円 為替レートまとめ</h1>
  <p>基準日: 2026-07-29 のレートを使った換算ツールです。</p>

  <div class="row">
    <input id="amount" type="number" value="1" step="any">
    <select id="currency"></select>
    <span>→ JPY</span>
  </div>

  <div class="result" id="result"></div>
  <div class="source">データ出典: https://frankfurter.dev (ECB公表データ)(基準日 2026-07-29 時点)</div>

<script>
  const rates = {"USD": 163.68, "EUR": 186.27, "GBP": 217.52, "AUD": 113.6};
  const target = "JPY";

  const select = document.getElementById("currency");
  Object.keys(rates).forEach(code => {
    const opt = document.createElement("option");
    opt.value = code;
    opt.textContent = code;
    select.appendChild(opt);
  });

  function update() {
    const amount = parseFloat(document.getElementById("amount").value) || 0;
    const code = select.value;
    const rate = rates[code];
    const converted = (amount * rate).toLocaleString(undefined, {maximumFractionDigits: 2});
    document.getElementById("result").textContent = `${amount} ${code} = ${converted} ${target}`;
  }

  document.getElementById("amount").addEventListener("input", update);
  select.addEventListener("change", update);
  update();
</script>
</body>
</html>
